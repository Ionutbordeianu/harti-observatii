name: Radar și observații ANM

on:
  schedule:
    - cron: '*/5 * * * *'       # la 5 minute (GitHub poate întârzia pornirea câteva minute; nimic nu se pierde)
  workflow_dispatch:

concurrency:
  group: publicare
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  actions: write

jobs:
  actualizare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install --quiet numpy h5py zstandard
      - name: Starea rulărilor anterioare
        uses: actions/cache/restore@v4
        with:
          path: |
            radar_cache
            qpe
            radar
            radar_ore2
            data
            rezultate_precipitatii
            arhiva_orara.json
            github_publicat.txt
            _ultima_obs.txt
            _stare_ok.txt
          key: stare-${{ github.run_id }}
          restore-keys: stare-
      - name: Radar și observații
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python cloud_obs.py
      - name: Păstrarea stării
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            radar_cache
            qpe
            radar
            radar_ore2
            data
            rezultate_precipitatii
            arhiva_orara.json
            github_publicat.txt
            _ultima_obs.txt
            _stare_ok.txt
          key: stare-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Ștergerea memoriilor vechi (păstrează ultimele 3)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh cache list --key stare- --sort created_at --order desc --limit 100 --json id --jq '.[3:][].id' \
            | xargs -r -n1 gh cache delete || true
